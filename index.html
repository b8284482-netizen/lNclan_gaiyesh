<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LN Clan - گالری باخت‌ها</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 به کلن LN خوش آمدید!</h1>
            <p class="subtitle">🔥 سوپر پخش شده‌ترین کلن گیم</p>
        </header>

        <section class="members">
            <h2>👥 لیست اعضای سوپر پخش شده:</h2>
            <div class="member-list">
                <div class="member online">✅ Bardia <span class="status">(آنلاین)</span></div>
                <div class="member offline">❌ Ali <span class="status">(آفلاین)</span></div>
                <div class="member online">✅ Soroush <span class="status">(آنلاین)</span></div>
                <div class="member offline">❌ Reza <span class="status">(آفلاین)</span></div>
            </div>
        </section>

        <section class="gallery">
            <h2>📸 گالری باخت‌های حماسی:</h2>
            <div class="gallery-grid">
                <div class="card">
                    <img src="https://via.placeholder.com/300x200/ff6b6b/fff?text=باخت+1" alt="باخت 1">
                    <p class="caption">🤣 "این دیگه چی بود؟!"</p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x200/ffd93d/333?text=باخت+2" alt="باخت 2">
                    <p class="caption">😂 "نمی‌دونم چطوری باختم!"</p>
                </div>
            </div>
        </section>

        <footer>
            <p>© 2026 LN Clan - همه چیز برای تفریح! 😎</p>
        </footer>
    </div>
</body>
</html>
